name: keep-warm

# Pings the Render /health endpoint so a free-tier web service doesn't spin
# down after 15 min of inactivity. Set a repo variable RENDER_URL to the base
# service URL (e.g. https://chunkyapi.onrender.com) under
# Settings -> Secrets and variables -> Actions -> Variables.

on:
  schedule:
    # Every 10 minutes. GitHub's scheduled runs are best-effort and can be
    # delayed several minutes under load, so 10 min gives slack under the
    # 15 min spin-down window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          BASE="${{ vars.RENDER_URL }}"
          if [ -z "$BASE" ]; then
            echo "RENDER_URL repo variable is not set; skipping."
            exit 0
          fi
          echo "Pinging ${BASE%/}/health"
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "${BASE%/}/health"
